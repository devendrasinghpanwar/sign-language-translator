name: Tests

# Run this workflow automatically whenever code is pushed or a pull
# request is opened against main. This is "Continuous Integration" (CI)
# — it proves your tests actually pass, automatically, not just on
# your own machine.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pandas scikit-learn numpy

      - name: Run tests
        run: |
          pytest tests/ -v
